name: mutation-nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true

    services:
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-retries=10

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite3, redis
          coverage: pcov

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction

      - name: Mutation testing
        # The same paths as MUTATION_PATHS in the Makefile, in the same order — the two lists had
        # drifted apart for four minors while this comment claimed they matched, so they are now
        # written to be diffed by eye.
        #
        # Pest does not accumulate repeated --path flags, hence one pass each.
        # Integrity sits higher than the rest: a mutant surviving there is a verification that lies.
        # A zero means measured and not gated, which is a position and not an omission: it is what
        # the paths holding no decision worth a percentage get.
        # Every path is measured before any threshold is enforced. The step runs under `bash -e`, so
        # letting a missed minimum abort it would leave the modules queued behind that one unmeasured
        # for as long as it stays below its threshold — which is exactly when their numbers matter.
        run: |
          set -- "src/Integrity:95" "src/Context:95" "src/Presentation:95" "src/Pipeline:90" "src/Security:90" "src/Diff:90" "src/Ledger:90" "src/Query:90" "src/Snapshot:90" "src/Http:90" "src/Dispatch:90" "src/Buffer:90" "src/Mass:90" "src/Retention:90" "src/Redaction:90" "src/Archive:0" "src/Compliance:0" "src/Partitions:0" "src/Telemetry:0" "src/Transactions:0" "src/Transitions:0" "src/Restore:0" "src/Events:0" "src/Jobs:0" "src/Console:0" "src/Capture:0" "src/Concerns:0" "src/Support:0" "src/Models:0" "src/SentinelServiceProvider.php:0"
          below=""
          for entry in "$@"; do
            path="${entry%%:*}"
            min="${entry##*:}"
            echo "== $path (min $min)"
            php -d pcov.directory=$GITHUB_WORKSPACE -d 'pcov.exclude=~/(vendor|tests)/~' -d memory_limit=2G \
              vendor/bin/pest --mutate --covered-only --path=$path --min=$min || below="$below $path"
          done
          if [ -n "$below" ]; then
            echo "== below their threshold:$below"
            exit 1
          fi

  mutation-databases:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true

    services:
      mysql:
        image: mysql:9
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: sentinel
        ports: ["3306:3306"]
        options: --health-cmd="mysqladmin ping -psecret" --health-interval=5s --health-retries=10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-retries=10
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: sentinel
        ports: ["5432:5432"]
        options: --health-cmd="pg_isready -U postgres" --health-interval=5s --health-retries=10

    strategy:
      fail-fast: false
      matrix:
        connection: [mysql, pgsql]

    name: mutation DB ${{ matrix.connection }}

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: dom, curl, libxml, mbstring, zip, pdo, pdo_mysql, pdo_pgsql
          coverage: pcov

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction

      # The advisory lock and the gap lock are invisible to a run on SQLite alone.
      - name: Mutation testing over the ledger
        env:
          DB_CONNECTION: ${{ matrix.connection }}
          DB_HOST: 127.0.0.1
          DB_USERNAME: ${{ matrix.connection == 'mysql' && 'root' || 'postgres' }}
          DB_PASSWORD: secret
          DB_DATABASE: sentinel
        run: |
          php -d pcov.directory=$GITHUB_WORKSPACE -d 'pcov.exclude=~/(vendor|tests)/~' -d memory_limit=2G \
            vendor/bin/pest --mutate --covered-only --path=src/Ledger --min=90
