name: mutation-nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  # One job per path, and not one job for all of them. A single pass over every path takes hours —
  # src/Integrity alone is forty minutes and src/Ledger forty-six — so the job that used to hold the
  # whole list was killed by its own timeout inside the first path, every night, and the
  # continue-on-error above it turned that into a green tick. A path per job gives each one a budget
  # it fits in, lets them run at once, and makes a red name itself.
  #
  # These are the fifteen paths of MUTATION_PATHS that carry a threshold. Each threshold comes from
  # the ficha of the version that introduced the module; none of them is decided here.
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          - { path: src/Integrity, min: 95 }
          - { path: src/Context, min: 95 }
          - { path: src/Presentation, min: 95 }
          - { path: src/Pipeline, min: 90 }
          - { path: src/Security, min: 90 }
          - { path: src/Diff, min: 90 }
          - { path: src/Ledger, min: 90 }
          - { path: src/Query, min: 90 }
          - { path: src/Snapshot, min: 90 }
          - { path: src/Http, min: 90 }
          - { path: src/Dispatch, min: 90 }
          - { path: src/Buffer, min: 90 }
          - { path: src/Mass, min: 90 }
          - { path: src/Retention, min: 90 }
          - { path: src/Redaction, min: 90 }

    name: mutation ${{ matrix.path }}

    services:
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-retries=10

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite3, redis
          coverage: pcov

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction

      - name: Mutation testing
        run: |
          php -d pcov.directory=$GITHUB_WORKSPACE -d 'pcov.exclude=~/(vendor|tests)/~' -d memory_limit=2G \
            vendor/bin/pest --mutate --covered-only --path=${{ matrix.path }} --min=${{ matrix.min }}

  # The rest of MUTATION_PATHS: measured, with a minimum of zero, which is a position and not an
  # omission — they hold no decision worth a percentage. The job is blocking all the same, so a path
  # that stops being able to run says so instead of going quiet.
  #
  # src/Compliance is the one path of the list that is missing here, and it is missing for a reason
  # that is not about its tests. Its entry point runs on every boot, so every test in the suite
  # covers it, and the runner builds its --filter from the name of every covering test: two thousand
  # four hundred of them, two hundred kilobytes in one argument, against a limit of a hundred and
  # twenty-eight. The subprocess cannot be spawned at all. `make mutation` names it and carries on.
  mutation-measured:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    services:
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-retries=10

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite3, redis
          coverage: pcov

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction

      - name: Mutation testing
        run: |
          set -- src/Archive src/Partitions src/Telemetry src/Transactions src/Transitions \
            src/Restore src/Events src/Jobs src/Console src/Capture src/Concerns src/Support \
            src/Models src/SentinelServiceProvider.php
          failed=""
          for path in "$@"; do
            echo "== $path"
            php -d pcov.directory=$GITHUB_WORKSPACE -d 'pcov.exclude=~/(vendor|tests)/~' -d memory_limit=2G \
              vendor/bin/pest --mutate --covered-only --path=$path || failed="$failed $path"
          done
          if [ -n "$failed" ]; then
            echo "== did not come back clean:$failed"
            exit 1
          fi

  mutation-databases:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    services:
      mysql:
        image: mysql:9
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: sentinel
        ports: ["3306:3306"]
        options: --health-cmd="mysqladmin ping -psecret" --health-interval=5s --health-retries=10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-retries=10
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: sentinel
        ports: ["5432:5432"]
        options: --health-cmd="pg_isready -U postgres" --health-interval=5s --health-retries=10

    strategy:
      fail-fast: false
      matrix:
        connection: [mysql, pgsql]

    name: mutation DB ${{ matrix.connection }}

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: dom, curl, libxml, mbstring, zip, pdo, pdo_mysql, pdo_pgsql
          coverage: pcov

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction

      # The advisory lock and the gap lock are invisible to a run on SQLite alone.
      - name: Mutation testing over the ledger
        env:
          DB_CONNECTION: ${{ matrix.connection }}
          DB_HOST: 127.0.0.1
          DB_USERNAME: ${{ matrix.connection == 'mysql' && 'root' || 'postgres' }}
          DB_PASSWORD: secret
          DB_DATABASE: sentinel
        run: |
          php -d pcov.directory=$GITHUB_WORKSPACE -d 'pcov.exclude=~/(vendor|tests)/~' -d memory_limit=2G \
            vendor/bin/pest --mutate --covered-only --path=src/Ledger --min=90
