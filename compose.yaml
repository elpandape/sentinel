services:
  php:
    build:
      context: docker
      args:
        PHP_VERSION: "8.4"
    volumes:
      - .:/app
    environment:
      COMPOSER_CACHE_DIR: /app/.cache/composer
      REDIS_HOST: redis

  # The buffered mode keeps entries here until a flush settles them, so the suite that covers it
  # needs a real one. Persistence is off for the same reason it is off for the databases: what the
  # tests put in is disposable, and a buffer that survives a restart is not what this mode promises.
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s

  mysql:
    image: mysql:9
    # The suite opens one connection per test: default max_connections falls short.
    # Every test recreates the schema, and each DDL statement would otherwise fsync through the
    # Docker VM's disk. The data is disposable: durability is off and the data directory is memory.
    command:
      - --max-connections=500
      - --skip-log-bin
      - --innodb-flush-log-at-trx-commit=0
      - --innodb-doublewrite=OFF
      - --innodb-flush-method=fsync
    tmpfs:
      - /var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: sentinel
    healthcheck:
      # TCP-only check: the socket answers during first-boot init, before TCP is up.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --protocol=TCP -psecret"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s

  postgres:
    image: postgres:16
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
    tmpfs:
      - /var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: sentinel
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
