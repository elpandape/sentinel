services:
  php:
    build:
      context: docker
      args:
        PHP_VERSION: "8.4"
    volumes:
      - .:/app
    environment:
      COMPOSER_CACHE_DIR: /app/.cache/composer

  mysql:
    image: mysql:9
    # The suite opens one connection per test: default max_connections falls short.
    command: --max-connections=500
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: sentinel
    healthcheck:
      # TCP-only check: the socket answers during first-boot init, before TCP is up.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --protocol=TCP -psecret"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s

  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: sentinel
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
